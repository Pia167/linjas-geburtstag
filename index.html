<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linja, dein Geburtstagsabenteuer!</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:#30254d;
    background:radial-gradient(ellipse at 10% 8%,#ffe0ed,transparent 32%),
    radial-gradient(ellipse at 92% 20%,#d9f5ff,transparent 30%),
    linear-gradient(145deg,#fff8ed,#f4efff 60%,#fff2f7)}
  .wrap{max-width:900px;margin:auto;padding:24px 18px 44px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .brand{font-weight:800;display:flex;align-items:center;gap:10px}
  .logo{background:#7355d9;color:white;border-radius:13px;width:38px;height:38px;display:grid;place-items:center;font-size:22px}
  .tag{background:white;padding:9px 13px;border-radius:99px;color:#7355d9;font-size:13px;font-weight:bold}
  .card{background:#ffffffdc;border:1px solid white;border-radius:28px;padding:clamp(24px,6vw,48px);text-align:center;box-shadow:0 18px 50px #39255e20}
  .eyebrow{display:inline-block;background:#f0eaff;color:#7355d9;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase}
  h1{font-size:clamp(34px,8vw,58px);line-height:1.04;letter-spacing:-.04em;margin:18px 0 12px}
  p{font-size:17px;color:#716985;line-height:1.6;max-width:600px;margin:0 auto}
  .big{font-size:62px;display:block;margin:15px}
  button,.link{font:inherit;font-weight:bold;border:0;border-radius:99px;padding:13px 20px;cursor:pointer;text-decoration:none;display:inline-block}
  button{background:linear-gradient(135deg,#7959dc,#a16ee9);color:white;box-shadow:0 8px 18px #7959dc3b}
  button:hover,.link:hover{transform:translateY(-2px)}
  .light{background:#f1edf7;color:#655780;box-shadow:none}
  .pink{background:linear-gradient(135deg,#ff7da8,#f09a78)}
  .maphead{text-align:center;margin:18px auto 24px}
  .maphead h1{font-size:clamp(32px,7vw,46px)}
  .paths{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .path{width:100%;text-align:left;background:white;color:#30254d;border:2px solid transparent;border-radius:22px;padding:17px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 22px #39245e12}
  .path:hover{border-color:#d9ccff;transform:translateY(-2px)}
  .emoji{width:54px;height:54px;flex:0 0 54px;border-radius:18px;display:grid;place-items:center;font-size:29px}
  .path strong{display:block;font-size:17px;margin-bottom:4px}
  .path small{color:#716985;font-size:14px}
  .path .arrow{margin-left:auto;color:#9c8bc5;font-size:24px}
  .clue{background:#fbf7ff;border:1px dashed #cbbcf2;border-radius:18px;padding:19px;margin:22px auto;color:#51466c;line-height:1.6;max-width:570px}
  .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
  .media{display:inline-block;margin-top:20px;color:#7355d9;background:#f0eaff;padding:12px 17px}
  .note{font-size:13px;color:#948aa4;margin-top:15px}
  .footer{text-align:center;color:#9a91a8;font-size:12px;margin-top:24px}
  @media(max-width:600px){.paths{grid-template-columns:1fr}.wrap{padding:17px 13px 30px}.card{border-radius:24px}}
/* Farben und Platz für die Handy-Dateileiste */
@media (max-width: 600px) {
  body {
    background: linear-gradient(145deg, #ffe3ef, #e7e0ff 55%, #dff8f3);
  }

  .wrap {
    padding-bottom: 160px;
  }

  .card {
    padding: 22px 18px 30px;
    background: linear-gradient(145deg, #fff, #fff1f7);
    border: 2px solid #fff;
  }

  .path {
    background: linear-gradient(120deg, #fff, #f4eaff);
  }

  .path:nth-child(1) .emoji { background: #ffc2d8 !important; }
  .path:nth-child(2) .emoji { background: #b9d8ff !important; }
  .path:nth-child(3) .emoji { background: #b8f1d3 !important; }
  .path:nth-child(4) .emoji { background: #ffd98f !important; }

  .clue {
    background: linear-gradient(135deg, #fff3bc, #ffe5f3);
    border: 1px solid #ffc96b;
  }

  .actions {
    position: sticky;
    bottom: 105px;
    z-index: 5;
    padding: 12px 0;
    background: linear-gradient(transparent, #fff8ff 35%);
    border-radius: 18px;
  }

  .actions button {
    min-height: 48px;
  }

  .footer {
    display: none;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">✦</span> Abenteuer-Post</div>
    <span class="tag">🎂 Level 10 erreicht!</span>
  </header>
  <main id="app"></main>
  <div class="footer">Eine Geburtstagsüberraschung nur für Linja ✨</div>
</div>
<script>
const trips=[
 {id:"phantasia",icon:"🐉",color:"#ffe4ec",path:"Drachenpfad",title:"Phantasialand",place:"Brühl",
  teaser:"Magische Welten und aufregende Abenteuer",
  clues:["Auf diesem Pfad warten fantastische Welten. Vielleicht begegnest du einem Drachen – und bestimmt gibt es aufregende Fahrten.",
  "Dein Abenteuer führt dich nach Brühl. Dort gibt es Themenwelten, Shows und Attraktionen für kleine und große Entdecker.",
  "Der geheime Ort heißt Phantasialand! Hier kannst du einen ganzen Tag lang neue Welten entdecken."],
  media:"https://www.phantasialand.de/de/themenpark/attraktionen/uebersicht-sommer/"},
 {id:"movie",icon:"🎬",color:"#e3efff",path:"Filmstar-Pfad",title:"Movie Park Germany",place:"Bottrop",
  teaser:"Filmwelten, Shows und jede Menge Action",
  clues:["Klappe, die erste! Auf diesem Pfad fühlt sich ein Tag an, als wärst du mitten in einem Film.",
  "Dein Abenteuer führt dich nach Bottrop. Dort warten Filmkulissen, Shows und jede Menge Action.",
  "Der geheime Ort heißt Movie Park Germany! Vielleicht wirst du dort selbst zum Star des Tages."],
  media:"https://www.movieparkgermany.de/besuch-planen/erlebnisse/attraktionen"},
 {id:"mini",icon:"🚂",color:"#e3f7ef",path:"Mini-Welten-Pfad",title:"Miniatur Wunderland",place:"Hamburg",
  teaser:"Eine riesige Welt im kleinen Format",
  clues:["Auf diesem Pfad wird alles winzig – aber das Abenteuer ist riesengroß. Kannst du entdecken, was sich überall bewegt?",
  "Dein Abenteuer führt dich nach Hamburg. Dort gibt es Landschaften, Städte, Züge und viele kleine Überraschungen.",
  "Der geheime Ort heißt Miniatur Wunderland! Hier gehst du auf Entdeckungsreise durch Mini-Welten."],
  media:"https://www.miniatur-wunderland.de/austausch/wunderland-informationen/wunderland-image-film/"},
 {id:"toverland",icon:"✨",color:"#fff0d9",path:"Zauberpfad",title:"Toverland",place:"Niederlande",
  teaser:"Zauberwelten und spannende Attraktionen",
  clues:["Ein bisschen Magie liegt in der Luft: Auf diesem Pfad entdeckst du geheimnisvolle Welten und aufregende Attraktionen.",
  "Dein Abenteuer führt dich in die Niederlande. Dort warten verschiedene Themenwelten – von märchenhaft bis richtig aufregend.",
  "Der geheime Ort heißt Toverland! Vielleicht findest du dort deine neue Lieblingsattraktion."],
  media:"https://www.toverland.com/de/attraktionen"}
];
let current=null,step=0,choice=null;
const app=document.getElementById("app");
function welcome(){app.innerHTML=`<section class="card">
 <span class="eyebrow">🔐 Geheime Geburtstagsmission</span><span class="big">🎁</span>
 <h1>Linja, dein Abenteuer<br>wartet auf dich!</h1>
 <p>Du bist jetzt 10 – und zu deinem Geburtstag wartet eine Überraschung. Folge den geheimen Pfaden, entdecke vier Abenteuer und such dir deinen Favoriten aus.</p>
 <div class="actions"><button onclick="map()">Mission starten →</button></div>
 <div class="note">Psst … am Ende entscheidest du, wohin es geht!</div></section>`}
function map(){app.innerHTML=`<div class="maphead"><span class="eyebrow">🗺️ Deine Abenteuerkarte</span>
 <h1>Welchen Pfad öffnest du?</h1><p>Erkunde die Abenteuer und wähle danach deinen Favoriten.</p></div>
 <div class="paths">${trips.map(t=>`<button class="path" onclick="openPath('${t.id}')">
 <span class="emoji" style="background:${t.color}">${t.icon}</span><span><strong>${t.path}</strong><small>${t.teaser}</small></span><span class="arrow">›</span></button>`).join("")}</div>
 ${choice?`<div class="actions"><button class="light" onclick="finish()">⭐ Deinen Favoriten ${trips.find(t=>t.id===choice).title} ansehen</button></div>`:""}`}
function openPath(id){current=trips.find(t=>t.id===id);step=0;showStep()}
function showStep(){let revealed=step>0,final=step===2;
 app.innerHTML=`<section class="card"><div class="eyebrow">${current.icon} ${current.path}</div>
 <div class="note">Hinweis ${step+1} von 3</div><span class="big">${final?current.icon:(step===0?"🔎":"✨")}</span>
 <h1>${final?current.title:(revealed?"Der Ort ist enthüllt!":"Ein Hinweis für dich …")}</h1>
 ${revealed?`<div class="note">${current.place}</div>`:""}
 <div class="clue">${current.clues[step]}</div>
 ${final?`<p>Welches Abenteuer soll dein Geburtstagsausflug werden?</p>
 <a class="link media" href="${current.media}" target="_blank" rel="noopener">📸 Bilder & Attraktionen ansehen ↗</a>`:
 `<p>Tippe weiter, um den nächsten Hinweis zu entdecken.</p>`}
 <div class="actions"><button class="light" onclick="map()">Zur Abenteuerkarte</button>
 ${final?`<button class="pink" onclick="choose('${current.id}')">Das ist mein Favorit! ⭐</button>`:`<button onclick="next()">Nächster Hinweis →</button>`}</div></section>`}
function next(){if(step<2)step++;showStep()}
function choose(id){choice=id;let t=trips.find(x=>x.id===id);
 app.innerHTML=`<section class="card"><span class="big">🌟</span><div class="eyebrow">Deine Wahl</div>
 <h1>${t.title}!</h1><p>Das wird dein Geburtstagsabenteuer. Sag deinen Erwachsenen Bescheid – dann könnt ihr gemeinsam den Ausflug planen!</p>
 <div class="actions"><button class="light" onclick="map()">Noch einen Pfad ansehen</button><button onclick="finish()">Überraschung öffnen →</button></div></section>`}
function finish(){let t=trips.find(x=>x.id===choice);if(!t){map();return}
 app.innerHTML=`<section class="card"><span class="eyebrow">🎉 Geburtstagsüberraschung</span><span class="big">${t.icon}</span>
 <h1>Wir gehen nach<br>${t.title}!</h1><p>Pack deine Abenteuerlust ein – wir freuen uns auf einen unvergesslichen Tag mit dir. Alles Liebe zum 10. Geburtstag, Linja!</p>
 <div class="actions"><button class="light" onclick="map()">Andere Abenteuer ansehen</button></div></section>`}
welcome();
</script>
</body>
</html>
